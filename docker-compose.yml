services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    restart: unless-stopped

  audit-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-audit-worker
    command: python -m app.workers.runner audit
    env_file:
      - ./backend/.env
    restart: unless-stopped

  failover-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-failover-worker
    command: python -m app.workers.runner failover
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inboundcheck-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
