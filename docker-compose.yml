services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Background Workers: Dedicated polling processes without HTTP interfaces.
  # Process monitoring is managed by Docker daemon restart policies.
  audit-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-audit-worker
    command: python -m app.workers.runner audit
    env_file:
      - ./backend/.env
    restart: unless-stopped

  failover-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inboundcheck-failover-worker
    command: python -m app.workers.runner failover
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://your-project-ref.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: inboundcheck-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
